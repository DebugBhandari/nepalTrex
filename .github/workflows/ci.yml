name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nepaltrex
          POSTGRES_USER: nepaltrex
          POSTGRES_PASSWORD: nepaltrex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nepaltrex -d nepaltrex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'npm'

      - run: npm install -g npm@11

      # Install root dependencies and generate lock file
      - run: npm install --no-fund --no-audit

      # Install workspace dependencies using Nx (uses the generated lock file)
      - run: npm ci

      - name: Prepare legacy database baseline
        env:
          DATABASE_URL: postgres://nepaltrex:nepaltrex@localhost:5432/nepaltrex
        run: >-
          node --input-type=module -e
          "import fs from 'fs/promises'; import { Client } from 'pg'; const client = new Client({ connectionString: process.env.DATABASE_URL }); await client.connect(); await client.query(await fs.readFile('db/init.sql', 'utf8')); await client.end();"

      - name: Apply database migrations
        env:
          DATABASE_URL: postgres://nepaltrex:nepaltrex@localhost:5432/nepaltrex
        run: npm run migrate:db

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: npx nx record -- npx nx format:check  --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e-ci
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
